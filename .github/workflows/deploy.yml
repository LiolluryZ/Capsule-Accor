name: Publier les capsules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier le mot de passe
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::Secret STATICRYPT_PASSWORD absent : rien n'est publié."
            exit 1
          fi

      - name: Régénérer le manifeste
        run: node tools/manifest.mjs

      - name: Préparer le site
        run: node tools/build-site.mjs

      - name: Chiffrer chaque page HTML
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          npx --yes staticrypt@3.5.4 _site -r -d _enc \
            --salt 30eb966ff1dcc83ce899f2980e37d1b8 \
            --config false \
            --short \
            --remember 30 \
            --template-title "Capsules IA" \
            --template-instructions "Ces capsules sont réservées aux personnes invitées." \
            --template-placeholder "Mot de passe" \
            --template-button "Ouvrir" \
            --template-remember "Se souvenir de moi (30 jours)" \
            --template-error "Mot de passe incorrect" \
            --template-color-primary "#DF2147" \
            --template-color-secondary "#1E1E1E"
          # Garde-fou : aucune page ne doit partir en clair.
          if grep -L "staticrypt" $(find _enc -name "*.html") | grep .; then
            echo "::error::Ces pages ne sont pas chiffrées."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _enc/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
