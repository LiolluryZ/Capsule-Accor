<script>
window.CAPSULE = {
  numero: 5,
  theme: "Usages et Méthodologie",
  titre: "Le Nexus",
  duree: "3 min",
  accroche: "L'IA ne connaît que ce que vous lui montrez. Le Context Nexus range le savoir de l'équipe en quatre registres, mis à jour par vos gestes du quotidien.",
  pages: [
    {
      forme: { type: "reseau", noeuds: 4, accent: [0, 1, 2, 3, 4], centre: true },
      kicker: "Le principe", chiffre: "4",
      titre: "registres : ce qu'on sait, veut, exige et fait",
      texte: "Knowledge, Purpose, Contracts et Process : chaque règle d'équipe a sa place au lieu de s'éparpiller entre wikis, messages et tickets. Vous cessez de réexpliquer le métier à chaque nouvel arrivant, humain ou IA."
    },
    {
      forme: { type: "entonnoir", niveaux: [100, 65, 35], accent: [2] },
      kicker: "La structure", chiffre: "3",
      titre: "niveaux hérités : organisation, programme, équipe",
      texte: "Votre équipe hérite des règles de sécurité de l'entreprise et des standards de sa direction, puis ajoute les siennes. Chaque niveau complète celui du dessus sans le remplacer, et l'équipe ne lit que son niveau et ce dont elle hérite."
    },
    {
      forme: { type: "pile", feuilles: 24, accent: "dessus" },
      kicker: "Le basculement",
      titre: "La documentation est lue par l'agent avant qu'il ne produise",
      texte: "Hier, on rédigeait après livraison un texte vite archivé et rarement relu. Aujourd'hui, l'équipe alimente le Nexus en amont : l'IA le consulte avant chaque tâche et livre du premier coup un travail conforme."
    },
    {
      forme: { type: "texte", segments: ["IMPLICITE"], accent: "tout" },
      kicker: "Le piège",
      titre: "Une règle non écrite n'existe pas pour l'agent",
      texte: "S'il n'a pas lu « l'heure qui fait foi est l'heure locale de l'hôtel », l'agent invente sa propre logique. Et une équipe ne peut pas contredire en silence une règle commune : l'écart est bloqué tant qu'il n'est pas déclaré et approuvé."
    },
    {
      forme: { type: "pile", feuilles: 20, accent: "tous-les-6" },
      kicker: "La comparaison",
      titre: "Du wiki oublié aux fichiers Git relus avant chaque action",
      texte: "Un wiki séparé du code s'endort vite. Versionné dans les dépôts GitLab de l'équipe, le contexte est relu en continu par les agents IA et la chaîne d'intégration (CI/CD) : un livrable partagé et auditable."
    },
    {
      forme: { type: "frise", jalons: 7, accent: [0, 1, 2, 3, 4, 5, 6] },
      kicker: "Ordre de grandeur", chiffre: "7",
      titre: "moments de la semaine suffisent à garder le Nexus à jour",
      texte: "ADR votée, ticket créé, merge request fusionnée, contrôle qualité échoué, incident résolu, revue de sprint, revue d'architecture. À chaque geste son registre : aucune réunion ni outil en plus."
    },
    {
      forme: { type: "libre", fn: (i, n, o) => {
        // Une ADR (lavande) se sépare en deux : une mémoire volumineuse (boule or) et une règle d'une ligne (trait or).
        const q = i % 10, t = o.rand(), g = () => o.gauss() * .035;
        const ball = (cx, cy, r, acc) => { const u = o.rand() * 2 - 1, a = o.rand() * o.TAU, s = Math.sqrt(1 - u * u), m = r * Math.cbrt(o.rand()); return [cx + m * s * Math.cos(a), cy + m * u, m * s * Math.sin(a), acc]; };
        if (q < 3) return ball(-2.3, 0, .62, 0);
        if (q < 5) { const b = q % 2 ? 1 : -1; return [-1.65 + 3 * t + g(), b * 1.15 * t * t + g(), g(), 0]; }
        if (q < 8) return ball(2.1, 1.2, .62, 1);
        return [1.4 + o.rand() * 1.5, -1.2 + g() * 1.6, g(), 1];
      } },
      kicker: "La décision", chiffre: "1 → 2",
      titre: "Une décision donne deux écrits : le pourquoi et la consigne",
      texte: "Une ADR (décision d'architecture) garde le débat dans Knowledge, pour l'équipe. L'agent reçoit dans Purpose une seule règle applicable : « Les échanges entre services passent par la solution retenue. » Exemple illustratif."
    },
    {
      forme: { type: "barres", valeurs: [200, 340], accent: [1] },
      kicker: "Contrôle échoué", chiffre: "340 ms",
      titre: "mesurés pour 200 exigés : un signal, pas un reproche",
      texte: "Quand un contrôle automatique bloque, le responsable du registre Contracts est alerté. L'équipe tranche : seuil irréaliste ou code à reprendre ? Le contrat ou le livrable est corrigé. Les chiffres ci-contre sont illustratifs."
    },
    {
      forme: { type: "reseau", noeuds: 4, accent: [0, 1, 2], centre: true },
      kicker: "Incident résolu", chiffre: "1 → 2",
      titre: "Un incident résolu enrichit deux registres d'un coup",
      texte: "Le post-mortem complète le guide de dépannage dans Process et consigne le piège technique dans Knowledge. Vos collègues comme vos assistants IA sauront éviter ou traiter la même panne la fois suivante."
    },
    {
      forme: { type: "dessin", vue: [60, 80], accent: [1], trait: 0, chemins: [
        "M8 4 h44 l-22 34 z",
        "M30 42 l22 34 h-44 z"
      ] },
      kicker: "La péremption",
      titre: "Périmée, une directive sort du contexte des agents sans être effacée",
      texte: "Chaque élément partagé porte un propriétaire et une date de dernière validation. Passé un seuil, il est signalé et retiré des consignes et de la recherche, jusqu'à ce qu'un responsable le revalide."
    },
    {
      forme: { type: "barres", valeurs: [1, 1, 1, 1], accent: [1, 2] },
      kicker: "Les rôles", chiffre: "2 sur 4",
      titre: "registres restent aux humains : l'intention et l'exigence",
      texte: "Vous fixez ce que l'on veut (Purpose) et ce que l'on exige (Contracts). L'agent observe, se corrige et exécute dans Process, sans jamais écrire les règles. Votre regard garantit qu'il résout le vrai problème."
    },
    {
      forme: { type: "texte", segments: ["ORAL"], accent: "tout" },
      kicker: "Le piège",
      titre: "Une leçon qui ne change rien dans Git est perdue pour l'IA",
      texte: "Un signal de production n'est appris que s'il produit une modification dans Git ou un ticket. Un problème débattu à l'oral reste invisible : au sprint suivant, l'assistant refait la même erreur."
    },
    {
      forme: { type: "frise", jalons: 3, accent: [0, 1, 2] },
      kicker: "En pratique", chiffre: "0",
      titre: "nouvelle réunion pour faire de la doc",
      texte: "Planification, daily et revue de sprint restent les mêmes. Au lieu de rédiger des comptes-rendus, vous y arbitrez les seuls écarts signalés par les contrôles automatiques : moins de réunions, des agents à jour."
    }
  ],
  aRetenir: {
    titre: "Quatre réflexes",
    points: [
      "<b>Écrivez vos conventions.</b> Tout ce qui reste implicite ou oral est ignoré par les assistants.",
      "<b>Séparez le pourquoi de la consigne.</b> À chaque décision, la mémoire va à vos collègues, la règle courte à l'IA.",
      "<b>Actualisez à chaud.</b> Merge, arbitrage ou fin d'incident : mettez le registre à jour sur le moment, avec un propriétaire et une date.",
      "<b>Gardez la main sur Purpose et Contracts.</b> L'IA applique, l'équipe fixe l'intention et l'exigence."
    ]
  }
};
