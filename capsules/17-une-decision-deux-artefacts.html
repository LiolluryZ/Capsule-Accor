<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Décision et directive · Capsule IA 17</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Red+Hat+Display:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../engine/capsule.css">
</head>
<body>
<script>
window.CAPSULE = {
  numero: 17,
  theme: "Usages et Méthodologie",
  titre: "Décision et directive",
  duree: "2 min",
  accroche: "Une décision d'architecture produit deux écrits : la mémoire du pourquoi pour l'équipe, la règle à appliquer pour l'agent. Les mélanger dégrade les deux.",
  pages: [
    {
      forme: { type: "libre", fn: (i, n, o) => {
        // Une ADR (lavande) se sépare en deux : une mémoire volumineuse (boule or) et une règle d'une ligne (trait or).
        const q = i % 10, t = o.rand(), g = () => o.gauss() * .035;
        const ball = (cx, cy, r, acc) => { const u = o.rand() * 2 - 1, a = o.rand() * o.TAU, s = Math.sqrt(1 - u * u), m = r * Math.cbrt(o.rand()); return [cx + m * s * Math.cos(a), cy + m * u, m * s * Math.sin(a), acc]; };
        if (q < 3) return ball(-2.3, 0, .62, 0);
        if (q < 5) { const b = q % 2 ? 1 : -1; return [-1.65 + 3 * t + g(), b * 1.15 * t * t + g(), g(), 0]; }
        if (q < 8) return ball(2.1, 1.2, .62, 1);
        return [1.4 + o.rand() * 1.5, -1.2 + g() * 1.6, g(), 1];
      } },
      kicker: "Le principe", chiffre: "1 → 2",
      titre: "Une ADR acceptée se découpe en deux artefacts",
      texte: "Une ADR (Architecture Decision Record) consigne une décision d'architecture. Une fois acceptée, elle donne deux écrits distincts : le Decision Context, qui est une mémoire, et la Decision Directive, qui est une instruction."
    },
    {
      forme: { type: "pile", feuilles: 20, accent: "tous-les-6" },
      kicker: "La mémoire",
      titre: "Le Decision Context garde le pourquoi, rangé dans Knowledge",
      texte: "La situation, les options pesées, les raisons d'écarter les autres, puis les conséquences observées après coup. On le retrouve par recherche documentaire quand le débat revient, au lieu de le refaire de zéro."
    },
    {
      forme: { type: "texte", segments: ["1", "ligne"], accent: [0] },
      kicker: "L'instruction",
      titre: "La Decision Directive tient en une règle positive, applicable",
      texte: "Rangée dans Purpose, ce que l'on veut, elle rejoint les consignes permanentes de l'agent (son system prompt). Elle dit ce qu'il faut faire, en une contrainte directement applicable, sans rejouer le débat."
    },
    {
      forme: { type: "dessin", vue: [120, 60], accent: [2], trait: 0, chemins: [
        "M4 4 h44 v52 h-44 z",
        "M56 25 h10 v-6 l10 11 l-10 11 v-6 h-10 z",
        "M84 23 h32 v14 h-32 z"
      ] },
      kicker: "L'exemple",
      titre: "Un long arbitrage d'un côté, une phrase de consigne de l'autre",
      texte: "Contexte : trois solutions de messagerie comparées, une écartée pour son coût d'exploitation, une autre pour sa maturité. Directive : « Les échanges entre services passent par la solution retenue. » L'exemple est illustratif."
    },
    {
      forme: { type: "libre", fn: (i, n, o) => {
        // À gauche, pourquoi et règle mélangés (or et lavande en vrac) ; à droite, deux ensembles séparés et nets.
        const q = i % 10, u = o.rand() * 2 - 1, a = o.rand() * o.TAU, s = Math.sqrt(1 - u * u);
        if (q < 5) { const m = 1.15 * Math.cbrt(o.rand()); return [-1.75 + m * s * Math.cos(a), m * u, m * s * Math.sin(a), o.rand() < .5 ? 1 : 0]; }
        if (q < 6) { const t = o.rand(); return [-.35 + t * .7, o.gauss() * .03 + (1 - Math.abs(t - .5) * 2) * 0, o.gauss() * .03, 0]; }
        const top = q < 8, m = (top ? .55 : .3) * Math.cbrt(o.rand());
        return [1.95 + m * s * Math.cos(a), (top ? .75 : -1.05) + m * u, m * s * Math.sin(a), 0];
      } },
      kicker: "Le piège",
      titre: "Une seule note pour tout, et chacun la lit de travers",
      texte: "Glissé dans les consignes permanentes, le débat devient une nuance que l'agent traîne à chaque tâche. Réduite à la règle, la mémoire perd le pourquoi, et la prochaine discussion repart de zéro."
    },
    {
      forme: { type: "frise", jalons: 5, accent: [4] },
      kicker: "La revue",
      titre: "La revue d'architecture revalide les décisions déjà prises",
      texte: "L'ADR acceptée écrit les deux artefacts. La revue d'architecture, elle, repasse sur les décisions existantes et enregistre les nouvelles. Une directive dépassée ne doit pas rester active par simple oubli."
    },
    {
      forme: { type: "dessin", vue: [60, 80], accent: [1], trait: 0, chemins: [
        "M8 4 h44 l-22 34 z",
        "M30 42 l22 34 h-44 z"
      ] },
      kicker: "La péremption",
      titre: "Périmée, une directive sort du contexte des agents sans être effacée",
      texte: "Chaque élément partagé porte un propriétaire et une date de dernière validation. Passé un seuil, il est signalé et retiré des consignes et de la recherche, jusqu'à ce qu'un responsable le revalide."
    },
    {
      forme: { type: "pictos", icones: ["personne", "document", "engrenage"], accent: [0] },
      kicker: "Les rôles",
      titre: "L'agent applique la directive, il ne l'écrit jamais",
      texte: "Purpose reste humain à tout niveau de maturité : l'agent observe, propose et signale, mais ne formule jamais l'intention. La décision d'architecture fait partie des six décisions jamais déléguées à l'IA."
    }
  ],
  aRetenir: {
    titre: "Quatre réflexes",
    points: [
      "<b>Séparez le pourquoi de la règle.</b> À chaque ADR acceptée, une mémoire pour l'équipe et une consigne pour l'agent.",
      "<b>Écrivez la directive en positif.</b> Une phrase qui dit quoi faire, applicable sans relire le débat.",
      "<b>Datez et attribuez.</b> Chaque directive a un propriétaire et une date de validation.",
      "<b>Gardez la décision humaine.</b> L'agent applique la règle, l'équipe la fixe."
    ]
  }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../engine/capsule.js"></script>
</body>
</html>
